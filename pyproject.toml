[project]
name = "webex-connect-kb"
version = "0.1.0"
description = "Source-grounded Webex Connect knowledge base and local video transcription tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "youtube-transcript-api==1.2.4",
  "yt-dlp==2026.8.19",
  "webvtt-py==0.5.1",
]

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1"]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
